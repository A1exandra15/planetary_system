 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="solar.css">
</head>
<body>
    <div id="universe">
      <div id="galaxy">
        <div id="sun">
        </div>
        <div id="mercury" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div>
        <div id="venus" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div>
        <div id="earth" class="orbit">
          <div class="pos">
            <div id="moon" class="orbit">
              <div id="moonPos" class="pos">
                <div class="planet"></div>
              </div>
            </div>
            <div id="earthPos" class="pos">
              <div id="earthPlanet" class="planet"></div>
            </div>
          </div>
        </div>
        <div id="mars" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div>
        <div id="jupiter" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div>
        <div id="saturn" class="orbit">
          <div class="pos">
            <div class="planet"></div>
            <div class="ring"></div>  
          </div>
        </div>
        <div id="uranus" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div>
        <div id="neptune" class="orbit">
          <div class="pos">
            <div class="planet"></div>
          </div>
        </div> 
      </div>
     </div>  
</body>
</html>
